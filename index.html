<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shambhu Mahadev Hotel - Orders</title>
    <style>
        /* बटणे छान दिसण्यासाठी साधी डिझाईन */
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f7f7f7; }
        .menu-btn { display: block; width: 80%; max-width: 300px; margin: 15px auto; padding: 15px; font-size: 18px; font-weight: bold; color: white; background-color: #ff5722; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .menu-btn:active { background-color: #e64a19; }
    </style>
</head>
<body>

    <h1>शंभू महादेव हॉटेल</h1>
    <p>तुमचा आवडता नाष्टा ऑर्डर करा:</p>

    <!-- १. हॉटेलचे मेनू बटणे -->
    <button class="menu-btn" onclick="giveOrder('नाष्टा पोहे')">🥣 नाष्टा पोहे</button>
    <button class="menu-btn" onclick="giveOrder('पॅटीस')">🧆 पॅटीस</button>
    <button class="menu-btn" onclick="giveOrder('वडापाव')">🍔 वडापाव</button>

    <!-- २. ऑर्डर आल्यावर वाजणारा रिंगटोन ऑडिओ टॅग -->
    <audio id="orderBell" src="https://mixkit.co" preload="auto"></audio>

    <!-- ३. फायरबेसचे आवश्यक स्क्रिप्ट्स (Libraries) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
      // ४. तुझ्या फायरबेस डेटाबेसचे कॉन्फिगरेशन
      const firebaseConfig = {
        databaseURL: "https://firebasedatabase.app"
      };
      
      // फायरबेस सुरू करा
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      // ५. ग्राहकाने बटणावर क्लिक केल्यावर ऑर्डर डेटाबेसमध्ये पाठवणे
      function giveOrder(menuName) {
        database.ref('live_order/').set({
          item: menuName,
          timestamp: Date.now()
        });
        alert("तुमची " + menuName + " ची ऑर्डर मालकाकडे पाठवली आहे!");
      }

      // ६. तुझ्या मोबाईलवर ही वेबसाईट उघडी असेल तर नवीन ऑर्डर येताच रिंग वाजवणे
      database.ref('live_order/').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          const bell = document.getElementById("orderBell");
          bell.play().catch(error => console.log("ऑडिओ प्ले झाला नाही: ", error));
        }
      });
    </script>

</body>
</html>
